{% extends "base.html" %}
{% block title %}ログイン | 出席管理システム{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<section class="card auth-card" aria-labelledby="login-title">
    <p class="eyebrow">Anti-Ghost Attendance</p>
    <h1 id="login-title">出席管理システム</h1>
    <p class="notice" role="note">授業開始前にログインしておいてください。QRコードは5秒ごとに更新されます。</p>
    <div id="login-error" class="alert alert-error" role="alert" hidden></div>
    <form id="login-form" class="stack" action="/auth/login" method="post" novalidate>
        <label for="login-id">学籍番号／職員番号</label>
        <input id="login-id" name="login_id" type="text" autocomplete="username" maxlength="64" required autofocus>
        <label for="password">パスワード</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="btn btn-primary" type="submit">ログイン</button>
    </form>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ static_url('js/auth.js') }}" defer></script>
{% endblock %}
