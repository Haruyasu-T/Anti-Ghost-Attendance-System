<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AGAS">
  <title>AGAS</title>
  <!-- QRコードの四隅にある位置検出パターンをモチーフにした。
       7:5:3 の比率はQRの仕様どおり。小さく表示しても潰れない。 -->
  <rect width="64" height="64" rx="14" fill="#155eef"/>
  <rect x="14" y="14" width="36" height="36" fill="none" stroke="#fff" stroke-width="6"/>
  <rect x="23" y="23" width="18" height="18" fill="#fff"/>
</svg>
