<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="AGAS">
  <title>AGAS</title>
  <!-- AGAS のモノグラム。
       ・角丸の四角 ＝ 引き延ばした A 2個（頂点が右上と左下の角）
       ・赤い輪と斜線 ＝ G（輪＋中央の棒）であり、
         同時に「上の弧 → 斜線 → 下の弧」と一筆でたどると S にもなる
       ・輪の左上を斜線と平行に少しだけ切ってあるのは、その S を読めるようにするため
       ・輪の下側は裾のギザギザにしてあり、目と合わせてお化け（＝なりすまし出席）になる
       斜線は四角より奥にあり、両端は枠の下に隠れて外には出ない。 -->
  <defs>
    <linearGradient id="agas-bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#3b1d7a"/>
    </linearGradient>
    <linearGradient id="agas-sq" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="agas-g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b35"/><stop offset="1" stop-color="#e01b24"/>
    </linearGradient>
    <radialGradient id="agas-hl" cx="0.26" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="agas-notch">
      <rect width="96" height="96" fill="#fff"/>
      <polygon points="3.13,8.01 41.32,46.20 40.26,47.26 2.07,9.07" fill="#000"/>
    </mask>
  </defs>

  <rect width="96" height="96" rx="20" fill="url(#agas-bg)"/>
  <rect width="96" height="96" rx="20" fill="url(#agas-hl)"/>

  <path d="M14 14 L82 82" fill="none" stroke="url(#agas-g)" stroke-width="7" stroke-linecap="butt"/>
  <path d="M62.14 62.14 L57.43 68 L52.71 62.14 L48 68 L43.29 62.14 L38.57 68 L33.86 62.14
           A20 20 0 1 1 67.56 52.16"
        fill="none" stroke="url(#agas-g)" stroke-width="7"
        stroke-linecap="butt" stroke-linejoin="round" mask="url(#agas-notch)"/>
  <path d="M22 12 H74 A10 10 0 0 1 84 22 V74 A10 10 0 0 1 74 84
           H22 A10 10 0 0 1 12 74 V22 A10 10 0 0 1 22 12 Z"
        fill="none" stroke="url(#agas-sq)" stroke-width="7"/>
  <circle cx="41" cy="40" r="3.2" fill="#fff"/>
  <circle cx="56" cy="40" r="3.2" fill="#fff"/>
</svg>
