# サーバーに入れる版を1つ残らず固定したもの（D-27）
#
# ■ 何のためか
#   requirements.txt が固定しているのは**直接書いた10個だけ**で、starlette や
#   anyio のような間接的に入るものは固定できていない。実際にずれていた：
#   2026-11-14 時点で手元(Windows)は starlette 1.6.0、CI(Linux)は 1.10.0。
#   starlette は FastAPI の土台なので、ここが動くと挙動も変わりうる。
#   このファイルは**テストが通った組み合わせそのまま**を残す。
#
# ■ どこで使うか
#   サーバー：  pip install -r requirements.lock
#   手元の開発：pip install -r requirements.txt （こちらを使う。下記の理由）
#   CI：        requirements.txt （こちらも意図的。下記の理由）
#
# ■ Linux / Python 3.11 向けである
#   この一覧はCI（ubuntu-latest / Python 3.11）が実際に入れた版で、
#   サーバーと同じ環境のもの。**Windowsでは使わないこと。**
#   uvloop は Windows に無いのでマーカーを付けてあるが、逆に Windows でだけ
#   必要になるもの（click が要求する colorama など）はこの一覧に入っていない。
#
# ■ CIがこのファイルを使わない理由
#   CIは requirements.txt から入れる。そうすると間接依存は毎回その時点の
#   最新に解決されるので、**上流が壊れたことを早く掴める**。
#   ロックで固定したものを回しても、それは「前に通った組み合わせ」を
#   もう一度通すだけで、新しい問題は見つからない。
#   役割が違う：CI＝変化を見つける／ロック＝本番を固定する。
#
# ■ 更新のしかた
#   1. requirements.txt を上げて push する（この時点ではCIが落ちる。
#      test_versions_agree_between_the_two_files が食い違いを捕まえるため）
#   2. その実行の pytest ジョブの "Record the installed set" の出力を見る。
#      このステップはテストより**前**にあるので、テストが落ちていても出力は残る
#   3. 出力をここに反映する
#   4. **uvloop にマーカーを付け直す**（`; sys_platform != "win32"`）。
#      pip freeze はマーカーを出さないので、貼ると消える
#   手元の pip freeze は使わない（Windows の解決結果になるため）。
#
# ■ 出典
#   2026-11-15 / CIの pytest ジョブ（実行 43618862644）の Record the installed set
#   fastapi 0.162.0 → 0.162.2 に伴う更新。間接依存は1つも動かなかった。

