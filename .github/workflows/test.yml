name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # requirements.lock ではなく requirements.txt から入れる。
        # こうすると間接依存は毎回その時点の最新に解決されるので、上流が
        # 壊れたことを早く掴める。ロックを回しても「前に通った組み合わせ」を
        # もう一度通すだけで、新しい問題は見つからない（requirements.lock の
        # 先頭のコメントと decisions.md D-27 を参照）。
        run: pip install -r requirements.txt

      # requirements.lock を作り直すときは、緑になった実行のこの出力を貼る。
      # 手元の pip freeze は使わない（Windowsの解決結果になり、uvloop が落ちる）。
      - name: Record the installed set
        run: pip freeze --exclude-editable

      - name: Run tests
        # テスト実行用のダミー値．本物の秘密鍵は絶対に書かない（GitHub Secretsも使わない）
        env:
          TOKEN_SECRET: dummy-secret-for-ci-only
          CAMPUS_IP_RANGES: 192.168.0.0/16
        run: pytest -v

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify QR actions
        run: node tests/test_teacher_qr_js.cjs

      # ズームはカメラの能力で分岐するので、手元の実機では片側しか試せない。
      - name: Verify scanner zoom
        run: node tests/test_scan_zoom_js.cjs

      # 教員画面の注意表示。サーバー側はPython側で固定してあるが、
      # 2つのAPIを突き合わせて描くところはここでしか見ていない。
      - name: Verify attendance list alerts
        run: node tests/test_attendance_list_js.cjs

      # 整形が崩れたまま入らないようにする。崩れていたら
      #   npx prettier --write .
      # で直せる。Jinjaテンプレートは対象外（.prettierignore に理由を記載）。
      - name: Check formatting
        run: |
          npm ci
          npx prettier --check .

  # 依存ライブラリに既知の脆弱性が無いかを調べる。
  #
  # テストとは別のジョブにしている。落ちる理由が「自分たちのコードが壊れた」
  # ではなく「使っているライブラリに新しい脆弱性が見つかった」なので、
  # どちらが起きたのかを一目で分けられるようにしておきたい。
  #
  # requirements.txt は版を `==` で固定しているので、CIが調べるのは
  # サーバーに入るのと同じ版。入れ直しても直らないので、脆弱性が見つかったら
  # Dependabot（.github/dependabot.yml）が上げてくる更新を取り込んで直す。
  # ここが赤いときは本番も同じ版で動いている、という意味になる。
  #
  # 直せない脆弱性（上流に修正版が無い）で止まったときは、落としたままに
  # せず pip-audit --ignore-vuln GHSA-xxxx で明示的に除外し、
  # なぜ許容するのかをここにコメントで残すこと。黙って無効化しないため。
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          # ランナーに最初から入っている pip / setuptools は版が古く、
          # requirements.txt とは無関係に警告の対象になる。先に上げておく。
          # --ignore-vuln で除外しないのは、土台の古さで赤いままにすると
          # 本当に見たい依存側の警告が埋もれるため。
          pip install --upgrade pip setuptools
          pip install -r requirements.txt
          pip install pip-audit

      # 実際にインストールされた一式を調べる（推移的な依存も含む）。
      # requirements.txt を読ませるだけだと、そこに書いていない依存が漏れる。
      - name: Audit installed packages
        run: pip-audit
