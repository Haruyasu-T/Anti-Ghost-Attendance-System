name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # CIのパスワードは使い捨てのDBにしか効かないので，ここに直書きしてよい．
    # （本物の秘密鍵は絶対に書かない．本番や開発用DBと同じ値も使わない．GitHub Secretsも使わない）
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: attendance_test
        ports:
          - 3306:3306
        # サービスコンテナは起動直後は接続を受け付けないので，healthy を待たせる
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=30

    env:
      DATABASE_URL: mysql+pymysql://root:ci-only-root-password@127.0.0.1:3306/attendance_test?charset=utf8mb4
      TOKEN_SECRET: ci-only-token-secret
      CAMPUS_IP_RANGES: 127.0.0.1/32,192.168.0.0/16

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify QR actions
        run: node tests/test_teacher_qr_js.cjs
